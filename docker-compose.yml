services:
  postgres:
    image: postgres:17-alpine
    container_name: investfacil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-investfacil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-investfacil123}
      POSTGRES_DB: ${POSTGRES_DB:-investfacil_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - investfacil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-investfacil} -d ${POSTGRES_DB:-investfacil_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  investfacil_postgres_data:
    driver: local
