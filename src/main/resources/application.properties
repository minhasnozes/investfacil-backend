spring.datasource.url=jdbc:postgresql://localhost:5432/investfacil_db
spring.datasource.username=investfacil
spring.datasource.password=investfacil123

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# CORS: origens do front-end autorizadas (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator: expõe apenas o health check, sem detalhes internos (banco, disco...)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Os endpoints do Actuator têm configuração de CORS própria (não usam o CorsConfig)
management.endpoints.web.cors.allowed-origins=${app.cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET
management.endpoints.web.cors.allowed-headers=*